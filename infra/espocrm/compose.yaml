name: tel-assistant-espocrm

services:
  espocrm-db:
    image: mariadb:11.8
    container_name: tel-assistant-espocrm-db
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: ${ESPOCRM_DB_ROOT_PASSWORD}
      MARIADB_DATABASE: ${ESPOCRM_DB_NAME}
      MARIADB_USER: ${ESPOCRM_DB_USER}
      MARIADB_PASSWORD: ${ESPOCRM_DB_PASSWORD}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - espocrm-db:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mariadb-admin ping -h localhost -u root -p$${MARIADB_ROOT_PASSWORD} --silent"]
      start_period: 30s
      interval: 15s
      timeout: 10s
      retries: 10

  espocrm:
    image: espocrm/espocrm:10.0.8
    container_name: tel-assistant-espocrm
    restart: unless-stopped
    environment:
      ESPOCRM_DATABASE_PLATFORM: Mysql
      ESPOCRM_DATABASE_HOST: espocrm-db
      ESPOCRM_DATABASE_NAME: ${ESPOCRM_DB_NAME}
      ESPOCRM_DATABASE_USER: ${ESPOCRM_DB_USER}
      ESPOCRM_DATABASE_PASSWORD: ${ESPOCRM_DB_PASSWORD}
      ESPOCRM_ADMIN_USERNAME: ${ESPOCRM_ADMIN_USERNAME}
      ESPOCRM_ADMIN_PASSWORD: ${ESPOCRM_ADMIN_PASSWORD}
      ESPOCRM_SITE_URL: ${ESPOCRM_SITE_URL}
    ports:
      - "127.0.0.1:${ESPOCRM_HTTP_PORT}:80"
    volumes:
      - espocrm-data:/var/www/html/data
      - espocrm-custom:/var/www/html/custom
      - espocrm-custom-client:/var/www/html/client/custom
    depends_on:
      espocrm-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "bin/command", "app-check"]
      start_period: 60s
      interval: 30s
      timeout: 15s
      retries: 10

  espocrm-daemon:
    image: espocrm/espocrm:10.0.8
    container_name: tel-assistant-espocrm-daemon
    restart: unless-stopped
    volumes_from:
      - espocrm
    entrypoint: docker-daemon.sh
    depends_on:
      espocrm:
        condition: service_healthy

volumes:
  espocrm-db:
  espocrm-data:
  espocrm-custom:
  espocrm-custom-client:
